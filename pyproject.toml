[project]
name = "kobra-s1-screws-tilt-adjust"
version = "0.1.0"
description = "Mechanical bed tramming for the Anycubic Kobra S1 running Rinkhals - a replacement for Klipper SCREWS_TILT_ADJUST"
readme = "README.md"
license = "MIT"
authors = [{ name = "Maik Hofmann" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
bedlevel = "bedlevel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedlevel"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
