<svg xmlns="http://www.w3.org/2000/svg" width="820" height="672" viewBox="0 0 820 672" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hAlu" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8b949e" stroke-width="1"/>
    </pattern>
    <pattern id="hCar" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6e7781" stroke-width="1"/>
    </pattern>
    <pattern id="gyr" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0,7 Q3.5,0 7,7 T14,7" fill="none" stroke="#c2410c" stroke-width="1.2"/>
    </pattern>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#0969da"/>
    </marker>
    <marker id="arB" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#0969da"/>
    </marker>
    <marker id="grn" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect width="820" height="672" fill="#ffffff"/>
  <text x="34" y="40" font-size="20" font-weight="600" fill="#1f2328">Mounting point in section</text>
  <text x="34" y="62" font-size="13" fill="#57606a">Vertically to scale (1 mm = 16 px), width foreshortened.</text>

  <!-- Duese, frei ueber der Platte -->
  <g>
    <path d="M282,86 L318,86 L318,112 L308,128 L292,128 L282,112 Z" fill="#4c5560" stroke="#1f2328" stroke-width="1.6"/>
    <path d="M292,128 L308,128 L304,140 L296,140 Z" fill="#39414a" stroke="#1f2328" stroke-width="1.6"/>
    <line x1="300" y1="144" x2="300" y2="160" stroke="#1a7f37" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#grn)"/>
    <line x1="318" y1="104" x2="470" y2="96" stroke="#57606a" stroke-width="1"/>
    <text x="476" y="94" font-size="13" fill="#1f2328">Nozzle — probes here</text>
    <text x="476" y="111" font-size="11.5" fill="#57606a">Probe offset 0/0, so the measuring</text>
    <text x="476" y="126" font-size="11.5" fill="#57606a">point is the screw position</text>
  </g>

  <!-- PEI + Magnetic base, durchgehend plan -->
  <rect x="140" y="164" width="320" height="10" fill="#2f4858" stroke="#1f2328" stroke-width="1.4"/>
  <rect x="140" y="174" width="320" height="8" fill="#57606a" stroke="#1f2328" stroke-width="1.4"/>

  <!-- Druckbett 5 mm = 80 px, mit Senkung fuer den Schraubenkopf -->
  <path d="M140,182 L265,182 L265,214 L335,214 L335,182 L460,182 L460,262 L140,262 Z"
        fill="#b8bec6" stroke="#1f2328" stroke-width="1.8"/>
  <path d="M140,182 L265,182 L265,214 L335,214 L335,182 L460,182 L460,262 L140,262 Z"
        fill="url(#hAlu)" opacity="0.5"/>
  <!-- Durchgangsbohrung -->
  <rect x="283" y="214" width="34" height="48" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>

  <!-- Schraubenkopf, versenkt -->
  <rect x="265" y="182" width="70" height="32" rx="1.5" fill="#5a6068" stroke="#1f2328" stroke-width="1.7"/>
  <g stroke="#2f3439" stroke-width="2.2">
    <line x1="282" y1="190" x2="318" y2="190"/>
    <line x1="282" y1="198" x2="318" y2="198"/>
    <line x1="282" y1="206" x2="318" y2="206"/>
  </g>

  <!-- Schaft M4 -->
  <rect x="286" y="214" width="28" height="236" fill="#7d8590" stroke="#1f2328" stroke-width="1.5"/>
  <g stroke="#3a424b" stroke-width="1">
    <line x1="286" y1="352" x2="314" y2="360"/><line x1="286" y1="366" x2="314" y2="374"/>
    <line x1="286" y1="380" x2="314" y2="388"/><line x1="286" y1="394" x2="314" y2="402"/>
    <line x1="286" y1="408" x2="314" y2="416"/><line x1="286" y1="422" x2="314" y2="430"/>
    <line x1="286" y1="436" x2="314" y2="444"/>
  </g>

  <!-- Spacer 10,5 mm = 168 px, AD 8,74 mm = 140 px -->
  <rect x="230" y="262" width="56" height="168" fill="#f6b09a" stroke="#1f2328" stroke-width="1.8"/>
  <rect x="230" y="262" width="56" height="168" fill="url(#gyr)" opacity="0.8"/>
  <rect x="314" y="262" width="56" height="168" fill="#f6b09a" stroke="#1f2328" stroke-width="1.8"/>
  <rect x="314" y="262" width="56" height="168" fill="url(#gyr)" opacity="0.8"/>

  <!-- Traeger mit Gewinde -->
  <rect x="140" y="430" width="320" height="72" fill="#8a9099" stroke="#1f2328" stroke-width="1.8"/>
  <rect x="140" y="430" width="320" height="72" fill="url(#hCar)" opacity="0.45"/>
  <rect x="283" y="430" width="34" height="72" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <g stroke="#1f2328" stroke-width="1.1">
    <line x1="283" y1="440" x2="317" y2="448"/><line x1="283" y1="454" x2="317" y2="462"/>
    <line x1="283" y1="468" x2="317" y2="476"/><line x1="283" y1="482" x2="317" y2="490"/>
  </g>

  <!-- Bruchkanten links und rechts -->
  <path d="M140,164 q-11,24 0,48 q11,24 0,48 q-11,24 0,48 q11,24 0,48 q-11,24 0,48 q11,24 0,50"
        fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <path d="M460,164 q11,24 0,48 q-11,24 0,48 q11,24 0,48 q-11,24 0,48 q11,24 0,48 q-11,24 0,50"
        fill="none" stroke="#1f2328" stroke-width="1.5"/>

  <!-- Bemassung: Hoehe links, ausserhalb -->
  <g stroke="#0969da" fill="#0969da" font-size="13">
    <line x1="106" y1="262" x2="106" y2="430" stroke-width="1.4" marker-start="url(#arB)" marker-end="url(#ar)"/>
    <line x1="126" y1="262" x2="100" y2="262" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="126" y1="430" x2="100" y2="430" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="96" y="342" text-anchor="end" font-weight="600">10,50 mm</text>
    <text x="96" y="358" text-anchor="end" font-size="11" fill="#57606a">tallest spacer</text>
  </g>

  <!-- Bemassung: Aussendurchmesser, unterhalb des Traegers -->
  <g stroke="#0969da" fill="#0969da" font-size="13">
    <line x1="230" y1="528" x2="370" y2="528" stroke-width="1.4" marker-start="url(#arB)" marker-end="url(#ar)"/>
    <line x1="230" y1="430" x2="230" y2="534" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="370" y1="430" x2="370" y2="534" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="300" y="548" text-anchor="middle" font-weight="600">⌀ 8,74 mm</text>
  </g>

  <!-- Bemassung: Innendurchmesser, rechts herausgezogen -->
  <g stroke="#0969da" fill="#0969da" font-size="12">
    <line x1="286" y1="310" x2="314" y2="310" stroke-width="1.4" marker-start="url(#arB)" marker-end="url(#ar)"/>
    <line x1="314" y1="310" x2="536" y2="310" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="542" y="306" font-weight="600" font-size="13">⌀ 4,3 mm</text>
    <text x="542" y="322" font-size="11.5" fill="#57606a">Clearance hole, M4</text>
  </g>

  <!-- Beschriftungen rechts -->
  <g font-size="13" fill="#1f2328">
    <line x1="462" y1="169" x2="536" y2="163" stroke="#57606a" stroke-width="1"/>
    <text x="542" y="167">PEI spring steel sheet</text>
    <line x1="462" y1="178" x2="536" y2="190" stroke="#57606a" stroke-width="1"/>
    <text x="542" y="194">Magnetic base</text>
    <line x1="462" y1="230" x2="536" y2="228" stroke="#57606a" stroke-width="1"/>
    <text x="542" y="232">Print bed, aluminium 5 mm</text>
    <line x1="335" y1="198" x2="536" y2="256" stroke="#57606a" stroke-width="1"/>
    <text x="542" y="260">M4 screw, countersunk</text>
    <line x1="370" y1="380" x2="536" y2="360" stroke="#57606a" stroke-width="1"/>
    <text x="542" y="356" font-weight="600" fill="#c2410c">Spacer, TPU 95A</text>
    <text x="542" y="373" font-size="11.5" fill="#57606a">1 wall line, 10 % gyroid —</text>
    <text x="542" y="388" font-size="11.5" fill="#57606a">acts as a spring, not a block</text>
    <line x1="462" y1="466" x2="536" y2="452" stroke="#57606a" stroke-width="1"/>
    <text x="542" y="456">Z axis carrier</text>
    <text x="542" y="472" font-size="11.5" fill="#57606a">M4 thread</text>
  </g>

  <g transform="translate(34,580)">
    <rect x="0" y="0" width="752" height="72" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <g transform="translate(34,30)">
      <path d="M0,0 a12,12 0 1 1 8,3.8" fill="none" stroke="#1a7f37" stroke-width="2.6" marker-end="url(#grn)"/>
    </g>
    <text x="86" y="26" font-size="13.5" font-weight="600" fill="#1f2328">Tightening (CW, clockwise)</text>
    <text x="86" y="45" font-size="12.5" fill="#24292f">pulls the bed against the spacer — the corner moves <tspan font-weight="600">down</tspan>, the gap to the nozzle grows.</text>
    <text x="86" y="62" font-size="11.5" fill="#57606a">Matches <tspan font-family="monospace">cw_lowers_bed = true</tspan>. Verify on your own machine with <tspan font-family="monospace">bedlevel calibrate-direction</tspan>.</text>
  </g>
</svg>
